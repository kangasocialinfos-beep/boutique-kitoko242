<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Boutique Kitoko</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="header">
    <div class="brand">Boutique Kitoko</div>

    <nav class="nav">
      <a href="#">Accueil</a>
      <a href="#products">Produits</a>
      <a href="#">Promo</a>
      <a href="#">Contact</a>
    </nav>
    
    <div class="search-bar">
  <input type="text" id="searchInput" placeholder="Rechercher un produit...">
  <button type="button" id="searchBtn">🔍</button>
</div>

  </header>

  <section class="banner">
    <div class="banner-content">
      <h1>Bienvenue dans notre boutique</h1>
      <p>Chaussures, casquettes, vêtements et accessoires à bon prix.</p>
    </div>
  </section>

  <main class="container">
    <section id="products" class="products-grid"></section>
    <p id="noResults" class="no-results" style="display:none;">Aucun produit trouvé.</p>
  </main>

  <button class="floating-cart-btn" id="openCartBtn" type="button" aria-label="Panier">
    <span class="cart-icon">🛒</span>
    <span class="cart-count" id="cartCount">0</span>
  </button>

  <div class="cart-overlay" id="cartOverlay"></div>

  <aside class="cart-panel" id="cartPanel">
    <div class="cart-panel-header">
      <h2>Mon panier</h2>
      <button id="closeCartBtn" type="button">✕</button>
    </div>

    <div id="cartItems" class="cart-items"></div>

    <div class="cart-panel-footer">
  <div class="cart-footer-row">
    <button type="button" id="checkoutBtn" class="checkout-btn">Commander</button>
    <p>Total : <span id="cartTotal">0 FCFA</span></p>
  </div>
  <button type="button" id="clearCartBtn" class="clear-cart-btn">Vider le panier</button>
</div>
  </aside>
  
  <div class="checkout-overlay" id="checkoutOverlay">
  <div class="checkout-modal">
    <button type="button" class="checkout-close" id="closeCheckoutBtn">×</button>
    <h2>Passer la commande</h2>

    <form id="checkoutForm" class="checkout-form">
      <label for="nom">Nom</label>
      <input type="text" id="nom" name="nom" placeholder="Ex: KIEMBA..." required>

      <label for="prenoms">Prénoms</label>
      <input type="text" id="prenoms" name="prenoms" placeholder="Ex: Dieudonné..." required>

      <label for="numero">Numéro</label>
      <input type="tel" id="numero" name="numero" placeholder="Ex: +242 06 499..." required>

      <button type="submit" class="submit-order-btn">Valider la commande</button>
    </form>
  </div>
</div>

<div id="loadingOverlay" class="loading-overlay" aria-live="polite" role="status">
  <div class="loading-box">
    <div class="spinner"></div>
    <p>Veuillez patienter, nous vous redirigeons vers WhatsApp pour confirmer votre commande.</p>
  </div>
</div>

  <script src="data.js"></script>
  <script src="main.js"></script>
</body>
</html>
